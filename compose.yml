services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    command: pnpm dev --hostname 0.0.0.0 --port 3000
    environment:
      NODE_ENV: development
    ports:
      - "${APP_PORT:-3000}:3000"
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  node_modules:
